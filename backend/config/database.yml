default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>

development:
  <<: *default
  database: finflow_development

test:
  <<: *default
  database: finflow_test

production:
  <<: *default
  database: finflow_production
  username: finflow
  password: <%= ENV["FINFLOW_DATABASE_PASSWORD"] %>
